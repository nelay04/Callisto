name: Deploy (Docker)

# Manual only. Start a run from the Actions tab.
#
# There is no Node toolchain on the VM — every step below is a docker command.
# Both images build from the repo root inside the container, so the runner
# never needs npm either; it only opens an SSH session and drives docker.
#
# The Podman equivalent is deploy-podman.yml. The two stacks are namespaced
# apart (project name, image tags, container names) but bind the same two
# ports, so only one can be running — deploying one does not stop the other,
# and the second will fail to bind. Pick one per host and stay with it.
on:
  workflow_dispatch:

# One deploy at a time, across *both* deploy workflows — the shared group name
# is deliberate, so a Docker run cannot race a Podman run through `git reset`
# and a rebuild on the same checkout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Contabo VM
    runs-on: ubuntu-latest

    # Prevents accidental deployment if you select a branch other than main in the UI
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_VM_HOST }}
          username: ${{ secrets.CONTABO_VM_USERNAME }}
          key: ${{ secrets.CONTABO_VM_SSH_KEY }}

          # Without this the script runs to the end and reports success even
          # when the build failed — a green deploy over a stale container.
          script_stops: true

          # A cold `--build` compiles both workspaces and runs `next build`.
          command_timeout: 30m

          script: |
            set -euo pipefail
            cd ~/Projects/Typescript/Callisto

            # Pull the latest code from GitHub.
            #
            # `reset --hard` only touches tracked files, so the three .env files
            # — which are git-ignored and live only on this VM — survive it.
            git fetch origin main
            git reset --hard origin/main

            # Fail early and legibly if the environment was never set up, rather
            # than one layer down inside a build that bakes the wrong URLs in.
            for f in .env apps/server/.env apps/web/.env; do
              test -f "$f" || { echo "missing $f — copy it from $f.example on the VM"; exit 1; }
            done

            # Rebuild and restart both services.
            #
            # NEXT_PUBLIC_* are build args read from the root .env, so the web
            # bundle only picks up a URL change when --build runs. A plain
            # restart would keep serving the previously baked values.
            docker compose -f docker-compose.yml up --build -d

            # Clean up old dangling images left behind by the rebuild.
            docker image prune -f

      - name: Verify the stack came up
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.CONTABO_VM_HOST }}
          username: ${{ secrets.CONTABO_VM_USERNAME }}
          key: ${{ secrets.CONTABO_VM_SSH_KEY }}
          script_stops: true
          script: |
            set -euo pipefail

            # This stack publishes mapped ports rather than using host
            # networking, but the host side is pinned to 127.0.0.1 either way —
            # reachable from the VM itself and from nowhere else. The host ports
            # come from the `ports:` mappings in docker-compose.yml.
            #
            # The web container's health check needs a moment after `up`, hence
            # the retry rather than a single immediate curl.
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3013/health >/dev/null \
                 && curl -fsS -o /dev/null http://127.0.0.1:3012/; then
                echo "server and web are both answering"
                curl -s http://127.0.0.1:3013/health
                exit 0
              fi
              sleep 2
            done

            echo "stack did not become healthy within 60s"
            docker ps -a
            docker compose -f ~/Projects/Typescript/Callisto/docker-compose.yml logs --tail 50
            exit 1
