name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The root `prepare` script builds @callisto/protocol, which the two apps
      # typecheck against.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_WS_URL: ws://127.0.0.1:3013/ws/session
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3013

  docker:
    name: Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only — nothing is pushed. This exists so the Dockerfiles cannot
      # silently rot while the npm build stays green.
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_WS_URL=ws://127.0.0.1:3013/ws/session
            NEXT_PUBLIC_API_URL=http://127.0.0.1:3013
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Both stacks must stay parseable from the .env.example files the README
      # tells you to copy. The Podman file is validated with the same binary
      # `podman compose` shells out to, so this covers it without installing
      # Podman on the runner.
      - name: Validate compose stacks
        run: |
          cp apps/server/.env.example apps/server/.env
          cp apps/web/.env.example apps/web/.env
          docker compose -f docker-compose.yml config --quiet
          docker compose -f podman-compose.yml config --quiet

      # CALLISTO_SYSTEM_PROMPT is a multi-line value with escaped quotes — the
      # one thing in .env that a parser change could silently truncate.
      - name: Check the system prompt survives env_file parsing
        run: |
          docker compose -f docker-compose.yml config --format json \
            | node -e "
              let d = '';
              process.stdin.on('data', (c) => (d += c)).on('end', () => {
                const p = JSON.parse(d).services.server.environment.CALLISTO_SYSTEM_PROMPT;
                if (!p || p.length < 4000) {
                  throw new Error('system prompt did not survive env_file parsing: ' + (p ? p.length : 0) + ' chars');
                }
                console.log('system prompt ok —', p.length, 'chars');
              });
            "
