services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_WS_URL: "wss://callisto-api.snowcastle.space/ws/session"
        NEXT_PUBLIC_API_URL: "https://callisto-api.snowcastle.space"
    restart: unless-stopped
    env_file: .env.local
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
