# Podman stack for Callisto. See docs/core/running.md for the full guide.
#
#   cp apps/server/.env.example apps/server/.env   # add your Gemini API key
#   cp apps/web/.env.example    apps/web/.env
#   cp .env.example             .env               # build args, this file reads it
#   npm run podman:up
#
# Then open http://127.0.0.1:3012
#
# Written for `podman compose` (which delegates to the docker-compose binary).
#
# Kept distinct from the Docker stack on every axis that could collide on a
# shared host — project name, image tags, container names — so both can exist
# side by side. They still bind the same two ports, so only one runs at a time.
#
# The one structural difference from docker-compose.yml: these services use
# host networking and bind 127.0.0.1 directly, instead of publishing a mapped
# port. See the note on the server service for why. Consequence worth knowing:
# there is no `ports:` mapping here, so the ports come *only* from PORT in each
# app's .env — change it there and nothing else needs editing.

name: callisto-podman

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: callisto/server:podman
    container_name: callisto-podman-server
    pull_policy: build
    restart: unless-stopped

    # The container shares the host's network namespace, so the process binds
    # the host's 127.0.0.1 directly. No bridge, no port publishing, no
    # userspace forwarder — HOST below is literally the address it listens on.
    #
    # Chosen over the two alternatives because both fail on this stack:
    #
    #   • bridge (the Compose default) needs netavark to program nftables,
    #     which is unavailable on some kernels — WSL2 among them — and fails
    #     with `netavark: nftables error ... "nft" did not return successfully`.
    #   • pasta avoids nftables, but starting two containers at once races:
    #     one pasta instance intermittently fails to spawn, and because the
    #     healthcheck runs *inside* the container's own namespace, the result
    #     is a container reporting `healthy` while unreachable from the host.
    #     A silent, intermittent outage is worse than either alternative.
    #
    # Host networking also makes the healthcheck meaningful: it probes the same
    # address a client uses, rather than a namespace-local one.
    #
    # The trade-off is no network isolation from the host. Acceptable here —
    # the containers are rootless, still isolated by PID and mount namespace,
    # and both bind loopback only.
    network_mode: host

    # The same file `npm run dev` reads. Nothing is duplicated into this file:
    # GEMINI_API_KEY, CORS_ORIGIN, MAX_SESSIONS_PER_IP, CALLISTO_LINKS and
    # CALLISTO_SYSTEM_PROMPT all arrive from here.
    env_file: apps/server/.env

    environment:
      NODE_ENV: production
      # Overrides the image's 0.0.0.0 back to loopback. On host networking this
      # is the host's own 127.0.0.1, so the port is reachable from this machine
      # and nowhere else — no `ports:` mapping is involved, and none would be
      # honoured. The port itself comes from PORT in apps/server/.env.
      HOST: 127.0.0.1

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined at build time, so they belong here rather
        # than in `environment` below. They are the address the *browser*
        # dials, which is why they never name a compose service: behind a
        # reverse proxy these become wss://your-domain/ws/session.
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://127.0.0.1:3013/ws/session}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:3013}
    image: callisto/web:podman
    container_name: callisto-podman-web
    pull_policy: build
    restart: unless-stopped

    # See the long note on the server service for why host networking.
    network_mode: host

    # Ordering only. The web container never calls the server — the browser
    # does — so there is no runtime dependency between them.
    depends_on:
      - server

    env_file: apps/web/.env

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Same reasoning as the server's HOST, except Next's standalone server
      # reads HOSTNAME. The port comes from PORT in apps/web/.env.
      HOSTNAME: 127.0.0.1
