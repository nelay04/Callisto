# Podman stack for Callisto. See docs/core/running.md for the full guide.
#
#   cp apps/server/.env.example apps/server/.env   # add your Gemini API key
#   cp apps/web/.env.example    apps/web/.env
#   npm run podman:up
#
# Then open http://127.0.0.1:3012
#
# Written for `podman compose` (which delegates to the docker-compose binary).
# It is deliberately NOT interchangeable with docker-compose.yml: `network_mode:
# pasta` below is Podman-specific and Docker will reject it.
#
# Kept distinct from the Docker stack on every axis that could collide on a
# shared host — project name, image tags, container names — so both can exist
# side by side. They still bind the same two ports, so only one runs at a time.

name: callisto-podman

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: callisto/server:podman
    container_name: callisto-podman-server
    pull_policy: build
    restart: unless-stopped

    # Rootless userspace networking, no bridge and no network to create.
    #
    # Affordable here because the two services never talk to each other — the
    # browser is the server's only client — so nothing needs service-name DNS.
    # Two benefits on a busy host: one less bridge network among the ones
    # already there, and no dependency on netavark's ability to program
    # nftables, which is unavailable on some kernels (WSL2 among them) and is
    # the usual cause of "netavark: nftables error" on `up`.
    #
    # Swap to the default bridge by deleting this line from both services if
    # you ever add container-to-container traffic.
    network_mode: pasta

    # The same file `npm run dev` reads. Nothing is duplicated into this file:
    # GEMINI_API_KEY, CORS_ORIGIN, MAX_SESSIONS_PER_IP, the profile links and
    # CALLISTO_SYSTEM_PROMPT all arrive from here.
    env_file: apps/server/.env

    environment:
      NODE_ENV: production
      # Overrides the .env value, and must: a published port cannot reach a
      # process bound to the container's own loopback. Host-side exposure is
      # still loopback-only — see the 127.0.0.1 prefix below.
      HOST: 0.0.0.0

    # Loopback only. The browser reaches this through a reverse proxy in
    # production; nothing is served to the network directly.
    # The container-side port tracks PORT in apps/server/.env — change one and
    # change the other.
    ports:
      - "127.0.0.1:3013:3013"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined at build time, so they belong here rather
        # than in `environment` below. They are the address the *browser*
        # dials, which is why they never name a compose service: behind a
        # reverse proxy these become wss://your-domain/ws/session.
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://127.0.0.1:3013/ws/session}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:3013}
    image: callisto/web:podman
    container_name: callisto-podman-web
    pull_policy: build
    restart: unless-stopped
    network_mode: pasta

    # Ordering only. The web container never calls the server — the browser
    # does — so there is no runtime dependency between them.
    depends_on:
      - server

    env_file: apps/web/.env

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # See the note on the server service — same reasoning, and Next's
      # standalone server reads HOSTNAME rather than HOST.
      HOSTNAME: 0.0.0.0

    ports:
      - "127.0.0.1:3012:3012"
